<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Winchester</title>
<style>
:root{--ui:#161616;--ln:#2e2e2e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#eee;font:15px system-ui,sans-serif;overflow:hidden}
#bg,#stage{position:fixed;inset:0}
#bg img{width:100%;height:100%;object-fit:cover;display:block}
.w{position:absolute;user-select:none;-webkit-user-select:none;max-width:96vw}
.edit .w{touch-action:none;outline:1px dashed #fff7;cursor:grab}
.edit .w.sel{outline:2px solid #fff}
.clk{white-space:nowrap;line-height:1.05;text-align:center;font-variant-numeric:tabular-nums}
.clk small{display:block;font-size:.22em;opacity:.7}
small:empty{display:none}
.t{display:block;text-align:center;color:#fff;text-decoration:none}
.ti{margin:0 auto;background:#222 center/cover;display:grid;place-items:center;font-weight:600;overflow:hidden}
.tl{margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mb{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;z-index:1000;width:44px;height:44px;border-radius:50%;border:0;background:#0007;color:#fff;font-size:24px}
#panel{position:fixed;left:0;right:0;bottom:0;z-index:999;max-height:72vh;overflow:auto;background:var(--ui);border-top:1px solid var(--ln);border-radius:16px 16px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
.edit #panel{max-height:42vh}
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
.b{background:#262626;border:1px solid var(--ln);border-radius:10px;padding:9px 8px;flex:1}
.b.on{background:#fff;color:#000}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.r{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:9px 0}
.r input:not([type=checkbox]),.r select{width:58%;background:#0d0d0d;border:1px solid var(--ln);border-radius:8px;padding:8px}
.r input[type=checkbox]{width:22px;height:22px}
.r input[type=color]{padding:2px;height:36px}
.sw{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.sw i{width:32px;height:32px;border-radius:50%;border:1px solid #fff5;cursor:pointer}
.wh{width:160px;height:160px;border-radius:50%;margin:6px auto;position:relative;touch-action:none;background:radial-gradient(circle,#fff,#fff0 70%),conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.wh i{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #000;pointer-events:none}
hr{border:0;border-top:1px solid var(--ln);margin:12px 0}
.n{opacity:.6;font-size:13px;margin:6px 0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:1001;background:#fff;color:#000;padding:9px 14px;border-radius:10px;max-width:90vw;font-size:14px}
.lite *{transition:none!important;animation:none!important}
</style></head><body>
<div id="bg"></div><div id="stage"></div>
<button id="mb" aria-label="Menu">&#8942;</button>
<div id="panel" hidden></div><div id="toast" hidden></div>
<script>
//<pure>
const N=(v,a,b,d)=>{v=+v;return isNaN(v)?d:Math.min(b,Math.max(a,v))};
const HEX=/^#[0-9a-f]{6}$/i;
const FONTS={Sans:'system-ui,sans-serif',Serif:'Georgia,serif',Mono:'ui-monospace,Menlo,monospace',Rounded:'"Trebuchet MS",system-ui,sans-serif',Narrow:'"Arial Narrow",Arial,sans-serif'};
const CLK={Minimal:{font:'Sans',size:72,weight:200,color:'#ffffff',date:false,sec:false,h12:false},Bold:{font:'Sans',size:84,weight:700,color:'#ffffff',date:true,sec:false,h12:false},Mono:{font:'Mono',size:56,weight:400,color:'#9fe8b8',date:false,sec:true,h12:false},Serif:{font:'Serif',size:68,weight:400,color:'#f1e8da',date:true,sec:false,h12:true}};
const DEF=()=>({bg:{mode:'solid',c1:'#000000',c2:'#1c1c1c',ang:160,img:false},font:'Sans',label:13,perf:{still:false,lite:false,quality:1},ws:[Object.assign({id:'c1',type:'clock',x:50,y:22},CLK.Minimal)]});
const safeUrl=u=>{try{u=String(u||'').trim();if(!u)return'';if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;const x=new URL(u);return/^https?:$/.test(x.protocol)?x.href:''}catch(e){return''}};
function clean(r){
 const d=DEF();if(!r||typeof r!=='object')return d;
 const b=r.bg&&typeof r.bg==='object'?r.bg:{},p=r.perf&&typeof r.perf==='object'?r.perf:{};
 d.bg={mode:['solid','grad','img'].includes(b.mode)?b.mode:'solid',c1:HEX.test(b.c1)?b.c1:'#000000',c2:HEX.test(b.c2)?b.c2:'#1c1c1c',ang:N(b.ang,0,360,160),img:b.img===true};
 d.font=FONTS[r.font]?r.font:'Sans';d.label=N(r.label,10,20,13);
 d.perf={still:!!p.still,lite:!!p.lite,quality:Math.round(N(p.quality,0,2,1))};
 if(Array.isArray(r.ws))d.ws=r.ws.slice(0,60).map(w=>{
  if(!w||typeof w!=='object')return null;
  const o={id:String(w.id||'').replace(/[^\w-]/g,'x').slice(0,12),type:w.type==='tile'?'tile':'clock',x:N(w.x,0,100,50),y:N(w.y,0,100,50)};
  if(o.type==='clock')Object.assign(o,{font:FONTS[w.font]?w.font:'Sans',size:N(w.size,20,200,72),weight:[200,400,700].includes(+w.weight)?+w.weight:400,color:HEX.test(w.color)?w.color:'#ffffff',h12:!!w.h12,date:!!w.date,sec:!!w.sec});
  else Object.assign(o,{name:String(w.name||'').slice(0,40),url:safeUrl(w.url),img:typeof w.img==='string'&&/^data:image\/(jpeg|png|webp);base64,[\w+\/=]*$/.test(w.img)&&w.img.length<80000?w.img:'',blank:!!w.blank,size:N(w.size,40,140,72),shape:['sq','rd','ci'].includes(w.shape)?w.shape:'rd'});
  return o}).filter(Boolean);
 const seen=new Set();d.ws.forEach(o=>{while(!o.id||seen.has(o.id))o.id=Math.random().toString(36).slice(2,8);seen.add(o.id)});
 return d}
const hsv2hex=(h,s,v)=>{const f=n=>{const k=(n+h/60)%6;return Math.round(255*(v-v*s*Math.max(0,Math.min(k,4-k,1))))||0};return'#'+[5,3,1].map(n=>f(n).toString(16).padStart(2,'0')).join('')};
const hex2hsv=x=>{const r=parseInt(x.slice(1,3),16)/255,g=parseInt(x.slice(3,5),16)/255,b=parseInt(x.slice(5,7),16)/255,M=Math.max(r,g,b),d=M-Math.min(r,g,b);let h=0;if(d){h=M===r?((g-b)/d)%6:M===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}return[h,M?d/M:0,M]};
//</pure>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s),KEY='winchester.v1',SAFE=location.hash==='#safe';
const SOLID=['#000000','#1a1a1a','#0b1d3a','#1b3b2f','#3a1230','#f2f2f2'];
const GRADS=[['#000000','#1c1c1c'],['#0f2027','#2c5364'],['#41295a','#2f0743'],['#ff512f','#dd2476'],['#134e5e','#71b280'],['#232526','#414345']];
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
let S=DEF(),sel=null,edit=false,tab='bg',gs='c1',tm,tt,url;
try{if(!SAFE)S=clean(JSON.parse(localStorage.getItem(KEY)))}catch(e){}
const cur=()=>S.ws.find(v=>v.id===sel);
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3500)}
const save=()=>{if(SAFE)return;clearTimeout(tm);tm=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Storage is full. Remove some tile photos.')}},250)};
/* image storage (IndexedDB, memory fallback) */
const mem={};
const db=()=>new Promise((ok,no)=>{try{const q=indexedDB.open('winchester',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}catch(e){no(e)}});
const idb=(m,fn)=>db().then(d=>new Promise((ok,no)=>{const t=d.transaction('f',m),r=fn(t.objectStore('f'));t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error)}));
const putBg=b=>idb('readwrite',s=>s.put(b,'bg')).catch(()=>{mem.bg=b});
const getBg=()=>idb('readonly',s=>s.get('bg')).then(v=>v||mem.bg).catch(()=>mem.bg);
const delBg=()=>{mem.bg=null;return idb('readwrite',s=>s.delete('bg')).catch(()=>{})};
const dataUrl=b=>new Promise(ok=>{const f=new FileReader();f.onload=()=>ok(f.result);f.readAsDataURL(b)});
const dataBlob=u=>{const[m,d]=u.split(','),s=atob(d),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new Blob([a],{type:m.match(/:(.*?);/)[1]})};
function shrink(f,m,q,sq){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onerror=()=>{URL.revokeObjectURL(u);no()};im.onload=()=>{URL.revokeObjectURL(u);const W=im.naturalWidth,H=im.naturalHeight;if(!W||!H)return no();const k=sq?Math.max(m/W,m/H):Math.min(1,m/Math.max(W,H)),w=sq?m:Math.round(W*k),h=sq?m:Math.round(H*k),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,(w-W*k)/2,(h-H*k)/2,W*k,H*k);c.toBlob(b=>b?ok(b):no(),'image/jpeg',q)};im.src=u})}
/* background */
async function applyBg(){
 const b=S.bg,el=$('#bg');el.innerHTML='';el.style.background='#000';
 if(url){URL.revokeObjectURL(url);url=null}
 if(b.mode==='solid')el.style.background=b.c1;
 else if(b.mode==='grad')el.style.background=`linear-gradient(${b.ang}deg,${b.c1},${b.c2})`;
 else{const bl=await getBg();if(!bl||S.bg.mode!=='img')return;el.innerHTML='';url=URL.createObjectURL(bl);const im=new Image();im.alt='';im.onerror=()=>{el.innerHTML=''};
  im.onload=()=>{if(S.perf.still&&bl.type==='image/gif'){im.onload=null;try{const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);im.src=c.toDataURL('image/jpeg',.85)}catch(e){}}};
  im.src=url;el.append(im)}}
async function pickBg(f){
 if(!f)return;
 try{let bl=f;
  if(f.type==='image/gif'){if(f.size>6e6)return toast('That GIF is over 6 MB. Pick a smaller one.')}
  else if(/^image\//.test(f.type))bl=await shrink(f,[720,1280,1920][S.perf.quality],.85,false);
  else return toast('Choose an image or a GIF.');
  await putBg(bl);S.bg.mode='img';S.bg.img=true;save();applyBg();form()
 }catch(e){toast('Could not load that image.')}}
/* stage */
const pos=(e,w)=>{e.style.left=w.x+'%';e.style.top=w.y+'%';e.style.transform=`translate(-${w.x}%,-${w.y}%)`};
function stage(){
 const st=$('#stage');st.textContent='';
 S.ws.forEach(w=>{
  const t=w.type==='tile',e=document.createElement(t&&!edit&&w.url?'a':'div');
  e.className='w '+(t?'t':'clk')+(w.id===sel?' sel':'');e.dataset.id=w.id;pos(e,w);
  if(t){
   if(e.tagName==='A'){e.href=w.url;e.rel='noopener noreferrer';if(w.blank)e.target='_blank'}
   const s=`min(${w.size}px,26vw)`;e.style.width=s;e.style.fontFamily=FONTS[S.font];e.style.fontSize=S.label+'px';
   const i=document.createElement('div'),l=document.createElement('div');i.className='ti';i.style.height=s;i.style.borderRadius={sq:'4px',rd:'22%',ci:'50%'}[w.shape];
   if(w.img)i.style.backgroundImage=`url(${w.img})`;else i.textContent=(w.name||'').trim().charAt(0).toUpperCase()||'+';
   l.className='tl';l.textContent=w.name;e.append(i,l)
  }else{
   const se=w.sec&&!S.perf.lite,len=w.h12?(se?11:8):(se?8:5);
   e.style.fontSize=`min(${w.size}px,${(88/(len*.6)).toFixed(1)}vw)`;e.style.fontFamily=FONTS[w.font];e.style.fontWeight=w.weight;e.style.color=w.color;e.innerHTML='<span></span><small></small>'}
  st.append(e)});
 tick()}
function tick(){
 clearTimeout(tt);const n=new Date();let sec=false;
 S.ws.forEach(w=>{if(w.type!=='clock')return;const e=$(`[data-id="${w.id}"]`);if(!e||!e.firstChild)return;
  const se=w.sec&&!S.perf.lite;sec=sec||se;let h=n.getHours();const m=String(n.getMinutes()).padStart(2,'0'),s=String(n.getSeconds()).padStart(2,'0');let ap='';
  if(w.h12){ap=h<12?' AM':' PM';h=h%12||12}else h=String(h).padStart(2,'0');
  e.firstChild.textContent=`${h}:${m}${se?':'+s:''}${ap}`;
  e.lastChild.textContent=w.date?n.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}):''});
 if(!document.hidden)tt=setTimeout(tick,sec?1000-n.getMilliseconds():60020-n.getSeconds()*1000-n.getMilliseconds())}
document.addEventListener('visibilitychange',tick);
function pick(id){sel=id;document.querySelectorAll('.w').forEach(n=>n.classList.toggle('sel',n.dataset.id===id));form()}
function xy(){const a=$('#fx'),b=$('#fy'),w=cur();if(a&&b&&w){a.value=w.x;b.value=w.y}}
$('#stage').addEventListener('pointerdown',ev=>{
 if(!edit)return;const e=ev.target.closest('.w');if(!e)return;
 const w=S.ws.find(v=>v.id===e.dataset.id);if(!w)return;
 ev.preventDefault();pick(w.id);
 const r=e.getBoundingClientRect(),W=innerWidth-r.width,H=innerHeight-r.height,sx=ev.clientX,sy=ev.clientY,l0=r.left,t0=r.top;
 try{e.setPointerCapture(ev.pointerId)}catch(x){}
 const mv=m=>{w.x=W>0?+N((l0+m.clientX-sx)/W*100,0,100,50).toFixed(1):50;w.y=H>0?+N((t0+m.clientY-sy)/H*100,0,100,50).toFixed(1):50;pos(e,w);xy()};
 const up=()=>{e.removeEventListener('pointermove',mv);e.removeEventListener('pointerup',up);e.removeEventListener('pointercancel',up);save()};
 e.addEventListener('pointermove',mv);e.addEventListener('pointerup',up);e.addEventListener('pointercancel',up)});
/* colour wheel */
function pk(host,hex,cb){
 let[h,s,v]=hex2hsv(hex);
 host.innerHTML='<div class="wh"><i></i></div><label class="r">Brightness<input type="range" min="0" max="100"></label>';
 const wh=$('.wh',host),k=$('i',wh),vs=$('input',host);
 const draw=()=>{const R=wh.clientWidth/2,a=h*Math.PI/180;k.style.left=R+s*R*Math.sin(a)+'px';k.style.top=R-s*R*Math.cos(a)+'px';wh.style.filter=`brightness(${.25+.75*v})`;vs.value=v*100};
 const out=()=>cb(hsv2hex(h,s,v));
 const pt=e=>{const r=wh.getBoundingClientRect(),R=r.width/2;if(!R)return;const dx=e.clientX-r.left-R,dy=e.clientY-r.top-R;h=(Math.atan2(dx,-dy)*180/Math.PI+360)%360;s=Math.min(1,Math.hypot(dx,dy)/R);draw();out()};
 wh.onpointerdown=e=>{wh.setPointerCapture(e.pointerId);pt(e);wh.onpointermove=pt};
 wh.onpointerup=wh.onpointercancel=()=>{wh.onpointermove=null};
 vs.oninput=()=>{v=vs.value/100;draw();out()};draw()}
/* menu */
const R=(l,i)=>`<label class="r">${l}${i}</label>`;
const rng=(k,v,a,b)=>`<input type="range" data-k="${k}" min="${a}" max="${b}" step="1" value="${v}">`;
const chk=(k,v)=>`<input type="checkbox" data-k="${k}"${v?' checked':''}>`;
const dd=(k,v,o)=>`<select data-k="${k}">${o.map(([a,b])=>`<option value="${esc(a)}"${String(a)===String(v)?' selected':''}>${esc(b)}</option>`).join('')}</select>`;
const btn=(a,t,on)=>`<button class="b${on?' on':''}" data-a="${a}">${esc(t)}</button>`;
function form(){
 const p=$('#panel');if(p.hidden)return;const top=p.scrollTop,w=cur(),b=S.bg,F=Object.keys(FONTS).map(k=>[k,k]);
 let h=`<div class="tabs">${[['bg','Background'],['w','Widgets'],['p','Performance'],['d','Data']].map(([k,t])=>btn('tab|'+k,t,tab===k)).join('')}</div>`;
 if(tab==='bg'){
  h+=`<div class="tabs">${btn('mode|solid','Solid',b.mode==='solid')}${btn('mode|grad','Gradient',b.mode==='grad')}${btn('mode|img','Image / GIF',b.mode==='img')}</div>`;
  if(b.mode==='solid')h+=`<div id="pk"></div><div class="sw">${SOLID.map(c=>`<i data-a="solid|${c}" style="background:${c}"></i>`).join('')}</div>`;
  if(b.mode==='grad')h+=`<div class="tabs">${btn('stop|c1','Color A',gs==='c1')}${btn('stop|c2','Color B',gs==='c2')}</div><div id="pk"></div><div class="sw">${GRADS.map((g,i)=>`<i data-a="grad|${i}" style="background:linear-gradient(135deg,${g[0]},${g[1]})"></i>`).join('')}</div>${R('Angle',rng('b.ang',b.ang,0,360))}`;
  if(b.mode==='img')h+=`<input type="file" id="bgf" accept="image/*"><p class="n">GIFs up to 6 MB. Other images are shrunk to fit.</p>${b.img?btn('rmimg','Remove image'):''}`}
 if(tab==='w'){
  h+=`<div class="tabs">${btn('add|clock','+ Clock')}${btn('add|tile','+ Tile')}${btn('edit',edit?'Done dragging':'Drag to place',edit)}</div>`;
  h+=`<div class="tabs">${S.ws.map(v=>btn('pick|'+v.id,v.type==='tile'?(v.name||'Tile'):'Clock',v.id===sel)).join('')}</div>`;
  if(w){h+='<hr>'+R('X (%)',`<input type="number" id="fx" data-k="w.x" min="0" max="100" step="0.1" value="${w.x}">`)+R('Y (%)',`<input type="number" id="fy" data-k="w.y" min="0" max="100" step="0.1" value="${w.y}">`);
   if(w.type==='clock')h+=R('Preset',dd('w.preset','',[['','Choose...'],...Object.keys(CLK).map(k=>[k,k])]))+R('Font',dd('w.font',w.font,F))+R('Size',rng('w.size',w.size,20,200))+R('Weight',dd('w.weight',w.weight,[[200,'Light'],[400,'Regular'],[700,'Bold']]))+R('Color',`<input type="color" data-k="w.color" value="${w.color}">`)+R('12-hour',chk('w.h12',w.h12))+R('Seconds',chk('w.sec',w.sec))+R('Date',chk('w.date',w.date));
   else h+=R('Name',`<input type="text" data-k="w.name" maxlength="40" value="${esc(w.name)}">`)+R('Link',`<input type="text" data-k="w.url" inputmode="url" placeholder="example.com" value="${esc(w.url)}">`)+R('Photo','<input type="file" id="tf" accept="image/*">')+(w.img?btn('rmphoto','Remove photo'):'')+R('Size',rng('w.size',w.size,40,140))+R('Shape',dd('w.shape',w.shape,[['sq','Square'],['rd','Rounded'],['ci','Circle']]))+R('Open in new tab',chk('w.blank',w.blank));
   h+=btn('del','Delete this widget')}
  h+='<hr>'+R('Tile label font',dd('s.font',S.font,F))+R('Tile label size',rng('s.label',S.label,10,20))}
 if(tab==='p')h+=R('Pause GIF animation',chk('p.still',S.perf.still))+R('Light mode (no seconds)',chk('p.lite',S.perf.lite))+R('Quality of new images',dd('p.quality',S.perf.quality,[[0,'Low'],[1,'Medium'],[2,'High']]))+'<p class="n">These only remove work. If something feels off, switch them off.</p>';
 if(tab==='d')h+=`<div class="tabs">${btn('exp','Export settings')}<button class="b" data-a="imp">Import settings</button>${btn('reset','Reset all')}</div><input type="file" id="impf" accept=".json,application/json" hidden><p class="n">Settings live in this browser for this web address. If the page ever misbehaves, add #safe to the end of the address to open it with defaults.</p>`;
 p.innerHTML=h;p.scrollTop=top;
 if($('#pk'))pk($('#pk'),b.mode==='solid'?b.c1:b[gs],c=>{const q=S.bg;if(q.mode==='solid')q.c1=c;else q[gs]=c;applyBg();save()});
 if($('#bgf'))$('#bgf').onchange=e=>pickBg(e.target.files[0]);
 if($('#tf'))$('#tf').onchange=async e=>{const f=e.target.files[0],t=cur();if(!f||!t)return;try{t.img=await dataUrl(await shrink(f,160,.8,true));S=clean(S);stage();save();form()}catch(x){toast('Could not load that photo.')}};
 if($('#impf'))$('#impf').onchange=e=>imp(e.target.files[0])}
$('#panel').addEventListener('input',async ev=>{
 const t=ev.target,k=t.dataset.k;if(!k||(t.type==='number'&&t.value===''))return;
 const[sc,key]=k.split('.'),v=t.type==='checkbox'?t.checked:(t.type==='range'||t.type==='number')?+t.value:t.value,o=sc==='w'?cur():sc==='s'?S:sc==='p'?S.perf:S.bg;if(!o)return;
 if(key==='preset'){if(CLK[v]){Object.assign(o,CLK[v]);S=clean(S);stage();save();form()}return}
 o[key]=v;S=clean(S);document.body.classList.toggle('lite',S.perf.lite);
 if(sc==='b')applyBg();else{stage();if(sc==='p'&&key==='still')applyBg()}save()});
$('#panel').addEventListener('click',async ev=>{
 const b=ev.target.closest('[data-a]');if(!b)return;const i=b.dataset.a.indexOf('|'),a=i<0?b.dataset.a:b.dataset.a.slice(0,i),v=i<0?'':b.dataset.a.slice(i+1);
 if(a==='tab'){tab=v;form()}
 else if(a==='mode'){S.bg.mode=v;applyBg();save();form()}
 else if(a==='stop'){gs=v;form()}
 else if(a==='solid'&&HEX.test(v)){S.bg.c1=v;applyBg();save();form()}
 else if(a==='grad'&&GRADS[+v]){S.bg.c1=GRADS[+v][0];S.bg.c2=GRADS[+v][1];applyBg();save();form()}
 else if(a==='rmimg'){await delBg();S.bg.img=false;S.bg.mode='solid';applyBg();save();form()}
 else if(a==='add'){if(S.ws.length>=60)return toast('Limit: 60 widgets.');
  S.ws.push(Object.assign({id:Math.random().toString(36).slice(2,8),x:50,y:50},v==='tile'?{type:'tile',name:'New tile',size:72}:Object.assign({type:'clock'},CLK.Minimal)));
  S=clean(S);sel=S.ws[S.ws.length-1].id;stage();save();form()}
 else if(a==='edit'){edit=!edit;document.body.classList.toggle('edit',edit);stage();form()}
 else if(a==='pick')pick(v);
 else if(a==='del'){S.ws=S.ws.filter(x=>x.id!==sel);sel=null;stage();save();form()}
 else if(a==='rmphoto'){const t=cur();if(t){t.img='';stage();save();form()}}
 else if(a==='exp')exp();
 else if(a==='imp')$('#impf').click();
 else if(a==='reset'&&confirm('Reset Winchester to defaults? This removes all tiles and images.')){S=DEF();sel=null;try{localStorage.removeItem(KEY)}catch(e){}await delBg();document.body.classList.remove('lite');applyBg();stage();form()}});
async function exp(){
 const o={v:1,s:S};try{const bl=await getBg();if(bl&&S.bg.img)o.bg=await dataUrl(bl)}catch(e){}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='winchester-settings.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
async function imp(f){
 if(!f)return;
 try{const o=JSON.parse(await f.text());S=clean(o&&o.s);
  if(o&&typeof o.bg==='string'&&/^data:image\//.test(o.bg)){await putBg(dataBlob(o.bg));S.bg.img=true}else{S.bg.img=false;if(S.bg.mode==='img')S.bg.mode='solid'}
  sel=null;document.body.classList.toggle('lite',S.perf.lite);save();applyBg();stage();form();toast('Settings imported.')
 }catch(e){toast('That file is not a Winchester settings file.')}}
$('#mb').onclick=()=>{const p=$('#panel');p.hidden=!p.hidden;if(p.hidden){edit=false;document.body.classList.remove('edit');sel=null;stage()}else form()};
addEventListener('error',()=>toast('Something went wrong. Add #safe to the address to open with defaults.'));
document.body.classList.toggle('lite',S.perf.lite);applyBg();stage();
})();
